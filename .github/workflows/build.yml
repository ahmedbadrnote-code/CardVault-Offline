name: Build CardVault Offline APK

on:
  push:
    branches: [ "main", "master", "refactor/standard-android-project" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode Release Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cardvault-release.jks"
          test -s "$RUNNER_TEMP/cardvault-release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/cardvault-release.jks" >> "$GITHUB_ENV"

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build Signed Release APK
        run: gradle assembleRelease
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/cardvault-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Verify Release APK Signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Upload Compiled Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CardVault-Offline-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
